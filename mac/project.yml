# Generate Xcode project: brew install xcodegen && xcodegen generate
name: LidTracker
options:
  bundleIdPrefix: net.denwilliams
  deploymentTarget:
    macOS: "14.0"

packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: "0.15.3"

targets:
  LidTracker:
    type: application
    platform: macOS
    sources:
      - Sources/LidTracker
    resources:
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.denwilliams.lidtracker
        PRODUCT_NAME: LidTracker
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.10
        MACOSX_DEPLOYMENT_TARGET: 14.0
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/LidTracker.entitlements
    dependencies:
      - package: SQLite
        product: SQLite
      - sdk: CoreWLAN.framework
      - sdk: CoreLocation.framework
      - sdk: ServiceManagement.framework
    postBuildScripts:
      - name: Copy to iCloud Applications
        script: |
          DEST="$HOME/Library/Mobile Documents/com~apple~CloudDocs/Applications"
          mkdir -p "$DEST"
          rm -rf "$DEST/LidTracker.app"
          cp -R "$BUILT_PRODUCTS_DIR/LidTracker.app" "$DEST/"
          echo "Copied to iCloud Applications"
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - LidTrackerTests

  LidTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LidTrackerTests
    dependencies:
      - target: LidTracker
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: 14.0
